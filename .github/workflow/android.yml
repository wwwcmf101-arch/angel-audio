name: Build Angel Audio

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Angel Audio
        run: |
          mkdir source
          unzip -q "AngelAudio (2).zip" -d source
          find source -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          WRAPPER=$(find source -type f -name gradlew | head -1)
          if [ -z "$WRAPPER" ]; then
            echo "No Gradle wrapper found. Android project needs inspection."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Angel-Audio-APK
          path: source/*/build/outputs/apk/debug/.apk
